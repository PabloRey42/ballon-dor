<title>Ballon d'Or, révisions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#08241D;--pitch:#0E3A2F;--pitch2:#124536;--gold:#D8AE3F;--goldp:#F2DF9E;--chalk:#E9EFE9;--dim:#9FB5AB;--miss:#E86A55;--line:rgba(233,239,233,.13)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font-family:Figtree,system-ui,sans-serif;color:var(--chalk);background:var(--deep) repeating-linear-gradient(180deg,transparent 0 64px,rgba(255,255,255,.018) 64px 128px);min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--deep);padding:calc(10px + env(safe-area-inset-top)) 18px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;max-width:524px;margin:0 auto}
.brand h1{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:28px;color:var(--gold)}
.brand span{font-size:13px;color:var(--dim);font-weight:600}
.day{max-width:524px;margin:2px auto 0;font-size:12px;color:var(--dim);font-weight:600}
.day.ok{color:var(--gold)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px auto 0;overflow:hidden;max-width:524px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
main{padding:20px 18px;max-width:560px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--deep);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--dim);font:600 12px Figtree,sans-serif;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:22px;height:22px}
nav button.on{color:var(--gold)}
h2{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:40px;line-height:1;margin-bottom:8px}
h3{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:24px;line-height:1.1}
.lead{color:var(--dim);font-size:15px;line-height:1.5;margin-bottom:18px}
.yr{font-family:'Big Shoulders Display',sans-serif;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:700 16px Figtree,sans-serif;background:var(--gold);color:var(--deep);margin-top:10px}
.btn.alt{background:transparent;color:var(--chalk);border:1.5px solid var(--line)}
.btn:disabled{opacity:.35}
.link{background:none;border:0;color:var(--dim);font:600 14px Figtree,sans-serif;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.chip{border:1.5px solid var(--line);background:none;color:var(--chalk);border-radius:20px;padding:8px 13px;font:600 14px Figtree,sans-serif}
.chip.on{background:var(--chalk);color:var(--deep);border-color:var(--chalk)}
.lbl{font-size:13px;color:var(--dim);font-weight:600}
.chap{border-top:1px solid var(--line);padding:16px 0}
.chap summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:12px}
.chap summary::-webkit-details-marker,.grp summary::-webkit-details-marker{display:none}
.plus{font-size:26px;color:var(--gold);transition:transform .2s}
.chap[open] .plus,.grp[open] .plus{transform:rotate(45deg)}
.grp{border-top:1px solid var(--line)}
.grp summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 0;font-weight:700;cursor:pointer}
.grp summary .plus{margin-left:auto;font-size:22px}
.grp .chips{margin-top:0}
.tip{border-left:3px solid var(--gold);padding:10px 14px;margin:14px 0 6px;background:rgba(216,174,63,.08);border-radius:0 10px 10px 0;font-size:14px;line-height:1.5}
.trap{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.trap b{display:block;font-size:16px;margin-bottom:2px;color:var(--goldp)}
.row{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row[onclick]{cursor:pointer}
.row .yr{font-size:30px;line-height:1}
.row b{font-size:16px}
.row small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.row em{display:block;font-style:normal;font-size:13px;color:var(--goldp);margin-top:4px;line-height:1.4}
.row.hid b,.row.hid small,.row.hid em{filter:blur(7px);user-select:none}
.ck{color:var(--gold);font-weight:800}
.card{perspective:1000px;height:450px;margin:12px 0;border-radius:18px;touch-action:pan-y;transition:transform .2s,opacity .2s}
.card.drag{transition:none}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;background:var(--pitch);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;overflow:auto}
.back{transform:rotateY(180deg);background:var(--pitch2)}
.ph{border-radius:50%;object-fit:cover;object-position:50% 20%;border:3px solid var(--gold);flex:none;background:var(--deep);margin-bottom:12px}
.ini{display:grid;place-items:center;font-family:'Big Shoulders Display',sans-serif;font-weight:900;color:var(--gold)}
.phw{display:flex;justify-content:center;margin-top:12px}
.hint{color:var(--dim);font-size:14px;margin-top:12px;line-height:1.45}
.qtop{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:14px;font-weight:600;margin-bottom:6px}
#tm{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:26px;color:var(--gold)}
.qyear{font-size:96px;line-height:.9;margin:18px 0 4px}
.qtext{font-size:19px;font-weight:600;line-height:1.35;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--pitch);border:1.5px solid var(--line);color:var(--chalk);border-radius:12px;padding:14px 16px;font:600 16px Figtree,sans-serif;margin-bottom:9px}
.opt small{color:var(--dim);font-weight:500}
.opt .yr{float:right;font-size:20px}
.opt.ok{border-color:var(--gold);background:rgba(216,174,63,.18)}
.opt.ko{border-color:var(--miss);background:rgba(232,106,85,.15)}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);margin-right:10px;font-size:13px;color:var(--gold);vertical-align:middle}
.fb{border-left:3px solid var(--gold);padding:10px 14px;background:rgba(255,255,255,.04);border-radius:0 10px 10px 0;margin-top:8px;font-size:14px;line-height:1.5}
.fb.bad{border-color:var(--miss)}
.txt{width:100%;padding:15px;border-radius:12px;border:1.5px solid var(--line);background:var(--pitch);color:var(--chalk);font:600 17px Figtree,sans-serif}
.txt::placeholder{color:var(--dim);font-weight:500}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.spec{text-align:left;background:var(--pitch);border:1.5px solid var(--line);border-radius:14px;padding:14px;color:var(--chalk);font-family:Figtree,sans-serif;display:flex;flex-direction:column;gap:2px}
.spec .yr{font-size:38px;line-height:1}
.spec b{font-size:16px}
.spec small{color:var(--dim);font-size:13px}
.st{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-bottom:10px;font-size:15px}
.st .b{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.st .b i{display:block;height:100%;background:var(--gold)}
.sec{margin:26px 0 12px}
.me{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.me div{background:var(--pitch);border:1px solid var(--line);border-radius:14px;padding:14px}
.me .yr{font-size:36px;line-height:1;display:block}
#sheet{position:fixed;inset:0;z-index:30}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--pitch);border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.sh h2{text-align:center}
.sh .lead{text-align:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--gold);color:var(--deep);font-weight:700;font-size:14px;padding:10px 16px;border-radius:20px;transition:.25s;z-index:40;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--goldp);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.inner,.bar i,.plus,.card,#toast{transition:none}.sh{animation:none}}
</style>

function lev(a,b){let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}

function opts(ok,c){return sh([ok,...sh(uniq(c.filter(x=>x!==ok))).slice(0,3)])}

if(t==="y2p")return {t,w,big:w.y,txt:"Qui a remporté le Ballon d'Or cette année-là ?",ok:w.n,o:opts(w.n,near)};
if(t==="photo")return {t,w,img:w.k,txt:"Qui est-ce ?",ok:w.n,o:opts(w.n,near)};
if(t==="club")return {t,w,big:w.y,txt:`Avec quel club ${w.n} est-il sacré ?`,ok:w.cl,o:opts(w.cl,W.map(x=>x.cl))};
if(t==="nat")return {t,w,big:w.y,txt:"De quelle nationalité est le lauréat ?",ok:w.c,o:opts(w.c,W.map(x=>x.c))};
if(t==="input")return {t,w,big:w.y,txt:"Écris le nom du lauréat.",ok:w.n};
if(t==="p2y"){
const ys=yearsOf(w.k),c=[];
for(let d=-7;d<=7;d++){const y=w.y+d;if(y>=1956&&y<=2025&&y!==2020&&!ys.includes(y))c.push(y)}
return {t,w,txt:`En quelle année ${w.n} (${w.cl}) remporte-t-il le Ballon d'Or${ys.length>1?`, pour l'un de ses ${ys.length} titres`:""} ?`,ok:w.y,o:opts(w.y,c).sort((a,b)=>a-b)};
}
const p=pool(),s=[w];
for(const x of [...sh(p.length>=8?p:W),...sh(W)]){if(s.length===4)break;if(!s.some(z=>z.k===x.k))s.push(x)}
return {t,w,txt:"Touche les lauréats du plus ancien au plus récent.",items:sh(s),pk:[]};
}
function newQz(o){return Object.assign({q:[],i:0,sc:0,st:0,best:0,err:[],done:false},o)}
function startQz(sc){
clearInterval(timer);
if(sc==="chrono"){
qz=newQz({chrono:true,end:Date.now()+60000});
addChrono();
timer=setInterval(ctick,250);
}else if(sc==="exam"){
qz=newQz({exam:true,q:sh(W).map(w=>mkQ("input",w))});
}else{
if(typeof sc==="number"){sel=["c:"+sc];weak=false}

const ys=Array.isArray(sc)?sc:0;
qz=newQz({q:pick(ys,ys?ys.length:nq).map(w=>mkQ(mode==="mix"?rnd(types):mode,w))});
}
tab="quiz";render();scrollTo(0,0);
}
function addChrono(){
const p=pool().length?pool():W,prev=qz.q.length?qz.q[qz.q.length-1].w.y:0;
let w=rnd(p);
for(let i=0;i<5&&p.length>1&&w.y===prev;i++)w=rnd(p);
qz.q.push(mkQ(rnd(["y2p","p2y"].concat(IMG[w.k]?["photo"]:[])),w));
}
function ctick(){
if(!qz||!qz.chrono||qz.done)return clearInterval(timer);
const r=Math.max(0,qz.end-Date.now());
if($("tm"))$("tm").textContent=Math.ceil(r/1000)+" s";
if($("tb"))$("tb").style.width=r/600+"%";

function finish(){
clearInterval(timer);
qz.done=true;S.games++;
if(qz.chrono)S.chrono=Math.max(S.chrono,qz.sc);
else if(qz.exam)S.exam=Math.max(S.exam,qz.sc);
else S.best=Math.max(S.best,Math.round(qz.sc/qz.q.length*100));
save();render();scrollTo(0,0);
}
function next(){
if(!qz||qz.done)return;
if(qz.chrono){if(Date.now()>=qz.end)return finish();addChrono();qz.i++;return render()}
qz.i++;
if(qz.i>=qz.q.length)return finish();
render();scrollTo(0,0);
}
function res(good){
const x=qz.q[qz.i];
x.good=good;
if(x.t!=="order"&&x.t!=="photo")mark(x.w.y,good);
tick();
if(good){qz.sc++;qz.st++;qz.best=Math.max(qz.best,qz.st)}else{qz.st=0;qz.err.push(x);vib()}
save();render();
if(good||qz.chrono){const z=qz,i=qz.i;setTimeout(()=>{if(qz===z&&qz.i===i)next()},qz.chrono?(good?250:800):900)}
}
function ans(i){const x=qz.q[qz.i];if(x.a!==undefined)return;x.a=i;res(x.o[i]===x.ok)}
function sub(){const x=qz.q[qz.i];if(x.a!==undefined)return;x.a=$("in").value;res(accept(x.a,x.w))}
function ord(j){

x.pk.push(j);

x.a=1;
const ys=x.pk.map(k=>x.items[k].y);
res(ys.every((y,k)=>!k||y>ys[k-1]));
}

if(x.o)body=x.o.map((o,i)=>`<button class="opt ${done?(o===x.ok?"ok":i===x.a?"ko":""):""}" onclick="ans(${i})">${o}</button>`).join("");
if(x.t==="input")body=done?`<div class="opt ${x.good?"ok":"ko"}">${esc(x.a)||"(vide)"}</div>`:`<input id="in" class="txt" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nom du joueur" onkeydown="if(event.key==='Enter')sub()"><button class="btn" onclick="sub()">Valider</button><div class="hint">Le nom de famille suffit. Une faute de frappe est tolérée.</div>`;
if(x.t==="order")body=x.items.map((it,j)=>{const k=x.pk.indexOf(j);return `<button class="opt ${done?(x.good?"ok":"ko"):""}" onclick="ord(${j})"><span class="num">${k>=0?k+1:""}</span>${it.n} <small>(${it.cl})</small>${done?`<span class="yr">${it.y}</span>`:""}</button>`}).join("")+(done?"":`<button class="link" onclick="qz.q[qz.i].pk=[];render()">Recommencer l'ordre</button>`);
let fb="";
if(done&&x.t==="order")fb=`<div class="fb ${x.good?"":"bad"}"><b>${x.good?"Ordre parfait.":"Pas le bon ordre."}</b> ${[...x.items].sort((a,b)=>a.y-b.y).map(it=>it.y+" "+it.n).join(", ")}</div>`;
else if(done&&x.t==="photo")fb=`<div class="fb ${x.good?"":"bad"}"><b>${x.good?"Bien vu.":"Raté."}</b> ${w.n}, ${w.c}. ${ys.length>1?"Titres":"Titre"} : ${ys.join(", ")}.</div>`;
else if(done)fb=`<div class="fb ${x.good?"":"bad"}"><b>${x.good?"Bien vu.":"Raté."}</b> ${w.y} : ${w.n}, ${w.cl}, ${w.c}.<br>${w.f}</div>`;
const top=qz.chrono?`<div class="qtop"><span id="tm">${Math.ceil(Math.max(0,qz.end-Date.now())/1000)} s</span><span>Score ${qz.sc}</span></div><div class="bar"><i id="tb" style="width:${Math.max(0,qz.end-Date.now())/600}%;transition:none"></i></div>`
:`<div class="qtop"><span>${qz.exam?"Examen ":"Question "}${qz.i+1}/${qz.q.length}</span><span>Score ${qz.sc}${qz.st>=3?`, série de ${qz.st}`:""}</span></div><div class="bar"><i style="width:${qz.i/qz.q.length*100}%"></i></div>`;
return `${top}
${x.big?`<div class="yr qyear">${x.big}</div>`:""}${x.img?`<div class="phw">${face(x.img,200)}</div>`:""}<div class="qtext">${x.txt}</div>${body}${fb}
${done&&!x.good&&!qz.chrono?`<button class="btn" onclick="next()">${qz.i+1<qz.q.length?"Question suivante":"Voir le résultat"}</button>`:""}
<div style="margin-top:18px"><button class="link" onclick="quitQz()">Quitter le quiz</button></div>`;
}

function lst(){
const f=norm(q);
if(!f)return rows(1956,2025,true);
const r=W.filter(w=>norm(`${w.y} ${w.n} ${w.cl} ${w.c} ${w.a.join(" ")}`).includes(f));
return r.length?r.map(w=>row(w,true)).join(""):`<p class="lead" style="margin-top:14px">Aucun résultat pour cette recherche. Essaie un nom de famille, un club ou un pays.</p>`;
}
function vListe(){
return `<h2>Palmarès</h2><p class="lead">Touche un joueur pour ouvrir sa fiche. Avec les noms masqués, une première touche révèle la ligne.</p>
<input class="txt" placeholder="Joueur, club, pays ou année" value="${esc(q)}" oninput="q=this.value;$('lst').innerHTML=lst()">
<div class="chips" style="margin-top:12px"><button class="chip ${hide?"on":""}" onclick="hide=!hide;render()">Masquer les noms</button></div>
<div id="lst">${lst()}</div>`;
}

function bars(l){const mx=l[0][1];return l.map(([k,v])=>`<div class="st"><span>${k}</span><b class="yr" style="font-size:22px">${v}</b><div class="b"><i style="width:${v/mx*100}%"></i></div></div>`).join("")}
function reset(){if(!rz){rz=true;return render()}S=Object.assign(clone(DEF),{img:S.img,cfg:S.cfg});rz=false;save();render()}
function vStats(){
const m=W.filter(w=>bx(w.y)>=3).length,seen=W.filter(w=>bx(w.y)>0).length,td=today(),st=streak();
return `<h2>Stats</h2><p class="lead">Ta progression, et les records à connaître par cœur.</p>
<h3 class="sec">Objectif du jour</h3>
<div class="st"><span>${Math.min(td,S.d.goal)}/${S.d.goal} réponses aujourd'hui</span><b class="yr" style="font-size:22px">${st} j de suite</b><div class="b"><i style="width:${Math.min(100,td/S.d.goal*100)}%"></i></div></div>
<div class="lbl">Objectif quotidien (cartes et questions)</div><div class="chips">${[10,20,30,50].map(g=>`<button class="chip ${S.d.goal===g?"on":""}" onclick="S.d.goal=${g};save();render()">${g}</button>`).join("")}</div>
<div class="me"><div><span class="yr">${m}</span><span class="lbl">années maîtrisées</span></div><div><span class="yr">${seen}</span><span class="lbl">années déjà vues</span></div><div><span class="yr">${S.games}</span><span class="lbl">quiz terminés</span></div><div><span class="yr">${S.best}%</span><span class="lbl">meilleur quiz</span></div><div><span class="yr">${S.chrono}</span><span class="lbl">record en 60 s</span></div><div><span class="yr">${S.exam}/69</span><span class="lbl">record à l'examen</span></div></div>
<h3 class="sec">Par chapitre</h3>${CH.map((c,i)=>{const a=chW(i).filter(w=>bx(w.y)>=3).length,b=chW(i).length;return `<div class="st"><span>${c.a} à ${c.b}</span><b class="yr" style="font-size:22px">${a}/${b}</b><div class="b"><i style="width:${a/b*100}%"></i></div></div>`}).join("")}
<h3 class="sec">Joueurs sacrés plusieurs fois</h3>${bars(counts("n").filter(e=>e[1]>1))}
<h3 class="sec">Titres par nationalité</h3>${bars(counts("c"))}
<h3 class="sec">Titres par club</h3>${bars(counts("cl"))}
<button class="btn alt" style="margin-top:28px;${rz?"border-color:var(--miss);color:var(--miss)":""}" onclick="reset()">${rz?"Confirmer : tout effacer":"Remettre ma progression à zéro"}</button>`;
}

if("serviceWorker" in navigator&&location.protocol==="https:"&&location.hostname.endsWith("github.io"))navigator.serviceWorker.register("sw.js").catch(()=>{});
load();

</script>
</body>
</html>
