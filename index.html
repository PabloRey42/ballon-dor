<title>Ballon d'Or, révisions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#08241D;--pitch:#0E3A2F;--pitch2:#124536;--gold:#D8AE3F;--goldp:#F2DF9E;--chalk:#E9EFE9;--dim:#9FB5AB;--miss:#E86A55;--line:rgba(233,239,233,.13)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Figtree,system-ui,sans-serif;color:var(--chalk);background:var(--deep) repeating-linear-gradient(180deg,transparent 0 64px,rgba(255,255,255,.018) 64px 128px);min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--deep);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;max-width:524px;margin:0 auto}
.brand h1{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:28px;color:var(--gold)}
.brand span{font-size:13px;color:var(--dim);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px auto 0;overflow:hidden;max-width:524px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
main{padding:20px 18px;max-width:560px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--deep);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--dim);font:600 12px Figtree,sans-serif;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:22px;height:22px}
nav button.on{color:var(--gold)}
h2{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:40px;line-height:1;margin-bottom:8px}
h3{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:24px;line-height:1.1}
.lead{color:var(--dim);font-size:15px;line-height:1.5;margin-bottom:18px}
.yr{font-family:'Big Shoulders Display',sans-serif;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:700 16px Figtree,sans-serif;background:var(--gold);color:var(--deep);margin-top:10px}
.btn.alt{background:transparent;color:var(--chalk);border:1.5px solid var(--line)}
.link{background:none;border:0;color:var(--dim);font:600 14px Figtree,sans-serif;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.chip{border:1.5px solid var(--line);background:none;color:var(--chalk);border-radius:20px;padding:8px 13px;font:600 14px Figtree,sans-serif}
.chip.on{background:var(--chalk);color:var(--deep);border-color:var(--chalk)}
.lbl{font-size:13px;color:var(--dim);font-weight:600}
.chap{border-top:1px solid var(--line);padding:16px 0}
.chap summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:12px}
.chap summary::-webkit-details-marker{display:none}
.chap[open] .plus,.grp[open] .plus{transform:rotate(45deg)}
.grp{border-top:1px solid var(--line)}
.grp summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 0;font-weight:700;cursor:pointer}
.grp summary::-webkit-details-marker{display:none}
.grp summary .plus{margin-left:auto;font-size:22px}
.grp .chips{margin-top:0}
.btn:disabled{opacity:.35}
.plus{font-size:26px;color:var(--gold);transition:transform .2s}
.tip{border-left:3px solid var(--gold);padding:10px 14px;margin:14px 0 6px;background:rgba(216,174,63,.08);border-radius:0 10px 10px 0;font-size:14px;line-height:1.5}
.row{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row .yr{font-size:30px;line-height:1}
.row b{font-size:16px}
.row small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.row em{display:block;font-style:normal;font-size:13px;color:var(--goldp);margin-top:4px;line-height:1.4}
.row.hid b,.row.hid small,.row.hid em{filter:blur(7px);user-select:none}
.ck{color:var(--gold);font-weight:800}
.card{perspective:1000px;height:380px;margin:12px 0}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;background:var(--pitch);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;overflow:auto}
.back{transform:rotateY(180deg);background:var(--pitch2)}
.hint{color:var(--dim);font-size:14px;margin-top:12px;line-height:1.45}
.qtop{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:14px;font-weight:600;margin-bottom:6px}
.qyear{font-size:96px;line-height:.9;margin:18px 0 4px}
.qtext{font-size:19px;font-weight:600;line-height:1.35;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--pitch);border:1.5px solid var(--line);color:var(--chalk);border-radius:12px;padding:14px 16px;font:600 16px Figtree,sans-serif;margin-bottom:9px}
.opt small{color:var(--dim);font-weight:500}
.opt .yr{float:right;font-size:20px}
.opt.ok{border-color:var(--gold);background:rgba(216,174,63,.18)}
.opt.ko{border-color:var(--miss);background:rgba(232,106,85,.15)}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);margin-right:10px;font-size:13px;color:var(--gold);vertical-align:middle}
.fb{border-left:3px solid var(--gold);padding:10px 14px;background:rgba(255,255,255,.04);border-radius:0 10px 10px 0;margin-top:8px;font-size:14px;line-height:1.5}
.fb.bad{border-color:var(--miss)}
.txt{width:100%;padding:15px;border-radius:12px;border:1.5px solid var(--line);background:var(--pitch);color:var(--chalk);font:600 17px Figtree,sans-serif}
.txt::placeholder{color:var(--dim);font-weight:500}
.st{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-bottom:10px;font-size:15px}
.st .b{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.st .b i{display:block;height:100%;background:var(--gold)}
.sec{margin:26px 0 12px}
.me{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.me div{background:var(--pitch);border:1px solid var(--line);border-radius:14px;padding:14px}
.me .yr{font-size:40px;line-height:1;display:block}
:focus-visible{outline:2px solid var(--goldp);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.inner,.bar i,.plus{transition:none}}

const $=id=>document.getElementById(id);
const bx=y=>S.box[y]||0;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function lev(a,b){let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function accept(v,w){const i=norm(v);if(!i)return false;const f=norm(w.n);return [f,f.split(" ").pop(),...w.a.map(norm)].some(x=>x===i||(x.length>5&&lev(x,i)<=1))}

async function load(){try{const v=window.storage?(await window.storage.get("bdor-v1")).value:localStorage.getItem("bdor-v1");if(v)S=Object.assign(S,JSON.parse(v))}catch(e){}render()}

if(ys)return W.filter(w=>ys.includes(w.y));

return weak?p.filter(w=>bx(w.y)<3):p;
}
function pick(ys,n){let p=pool(ys);if(!p.length)p=W;return sh(p).sort((a,b)=>bx(a.y)-bx(b.y)).slice(0,n)}

function go(t){tab=t;render();scrollTo(0,0)}

function row(w,tap){return `<div class="row ${tap&&hide?"hid":""}" ${tap?`onclick="this.classList.remove('hid')"`:""}><span class="yr">${w.y}</span><div><b>${w.n}</b>${bx(w.y)>=3?' <span class="ck">✓</span>':""}<small>${w.cl}, ${w.c}</small><em>${w.f}</em></div></div>`}
function gap(){return `<div class="row"><span class="yr">2020</span><div><b>Non décerné</b><small>Édition annulée à cause du Covid</small></div></div>`}
function rows(a,b,tap){let o="";for(let y=a;y<=b;y++){const w=W.find(x=>x.y===y);o+=w?row(w,tap):gap()}return o}

function scopeChips(){
let n=0;
return `<div class="lbl">Quels Ballons d'Or ? Combine autant de catégories que tu veux.</div>
<div class="chips"><button class="chip ${sel.length?"":"on"}" onclick="sel=[];render()">Tout</button><button class="chip ${weak?"on":""}" onclick="weak=!weak;render()">Seulement à travailler</button></div>
${GR.map(([t,l],g)=>{const c=l.filter(x=>sel.includes(x[0])).length;return `<details class="grp" ${og[g]?"open":""} ontoggle="og[${g}]=this.open"><summary>${t}${c?` <span class="ck">${c}</span>`:""}<span class="plus">+</span></summary><div class="chips">${l.map(([k,x])=>`<button class="chip ${sel.includes(k)?"on":""}" onclick="tg(${n++})">${x}</button>`).join("")}</div></details>`}).join("")}
<p class="lbl" style="margin:16px 0 4px">${pool().length} titres dans ta sélection${pool().length?"":". Retire le filtre « à travailler » ou ajoute une catégorie."}</p>`;
}

function vCours(){
return `<h2>Réviser</h2><p class="lead">69 titres découpés en 7 chapitres de dix ans. Lis un chapitre, puis lance les cartes ou le quiz dessus. Le ✓ doré marque une année maîtrisée (3 bonnes réponses d'affilée).</p>
<details class="chap"><summary><div><h3>Les règles du jeu</h3><div class="lbl">Ce qui a changé depuis 1956</div></div><span class="plus">+</span></summary>
${RULES.map(([y,t])=>`<div class="row"><span class="yr">${y}</span><div style="font-size:14px;line-height:1.45">${t}</div></div>`).join("")}</details>
${CH.map((c,i)=>{const ws=chW(i),m=ws.filter(w=>bx(w.y)>=3).length;return `<details class="chap"><summary><div><span class="yr" style="font-size:16px">${c.a} à ${c.b}</span><h3>${c.t}</h3><div class="lbl">${m}/${ws.length} maîtrisés</div></div><span class="plus">+</span></summary>
<div class="tip"><b>Pour retenir.</b> ${c.tip}</div>${rows(c.a,c.b)}
<button class="btn" onclick="startFc(${i})">Cartes sur ce chapitre</button><button class="btn alt" onclick="startQz(${i})">Quiz sur ce chapitre</button></details>`}).join("")}`;
}

function startFc(ch){if(ch!==undefined){sel=["c:"+ch];weak=false}fc={c:pick(0,10),i:0,ok:0,flip:false};tab="cartes";render();scrollTo(0,0)}
function flip(){fc.flip=!fc.flip;document.querySelector(".card").classList.toggle("flip",fc.flip);$("rt").style.visibility=fc.flip?"visible":"hidden"}
function rate(k){mark(fc.c[fc.i].y,!!k);if(k)fc.ok++;fc.i++;fc.flip=false;save();render()}
function vCartes(){
if(!fc)return `<h2>Cartes</h2><p class="lead">Séries de 10 cartes. Retourne, sois honnête : ce que tu rates revient en priorité, ce que tu connais s'espace.</p>
<div class="lbl">Sens</div><div class="chips">${[["y","Année → joueur"],["p","Joueur → année"]].map(([v,l])=>`<button class="chip ${dir===v?"on":""}" onclick="dir='${v}';render()">${l}</button>`).join("")}</div>
${scopeChips()}<button class="btn" ${pool().length?"":"disabled"} onclick="startFc()">Commencer la série</button>`;
if(fc.i>=fc.c.length)return `<h2>Série terminée</h2><p class="lead">${fc.ok}/${fc.c.length} connues du premier coup.</p><button class="btn" onclick="startFc()">Nouvelle série</button><button class="btn alt" onclick="fc=null;render()">Changer les réglages</button>`;
const w=fc.c[fc.i],ys=W.filter(x=>x.k===w.k).map(x=>x.y);
const front=dir==="y"?`<span class="yr" style="font-size:120px;line-height:.9">${w.y}</span><div class="hint">Qui a gagné ?</div>`
:`<div style="font-size:32px;font-weight:700;line-height:1.1">${w.n}</div><div class="hint">${w.cl}${ys.length>1?`<br>L'un de ses ${ys.length} titres`:""}</div><div class="hint">En quelle année ?</div>`;
const back=`<span class="yr" style="font-size:${dir==="y"?44:96}px;line-height:.9">${w.y}</span><div style="font-size:26px;font-weight:700;margin-top:8px;line-height:1.1">${w.n}</div><div class="hint" style="margin-top:6px">${w.cl}, ${w.c}, ${w.pos.toLowerCase()}</div><div class="hint" style="color:var(--goldp)">${w.f}</div>${ys.length>1?`<div class="hint">Tous ses titres : ${ys.join(", ")}</div>`:""}`;
return `<div class="qtop"><span>Carte ${fc.i+1}/${fc.c.length}</span><button class="link" onclick="fc=null;render()">Quitter</button></div>
<div class="bar"><i style="width:${fc.i/fc.c.length*100}%"></i></div>
<div class="card" onclick="flip()"><div class="inner"><div class="face">${front}<div class="hint" style="margin-top:28px">Touche pour retourner</div></div><div class="face back">${back}</div></div></div>
<div id="rt" style="display:flex;gap:10px;visibility:hidden"><button class="btn alt" onclick="rate(0)">À revoir</button><button class="btn" onclick="rate(1)">Je savais</button></div>`;
}

function opts(ok,c){return sh([ok,...sh(uniq(c.filter(x=>x!==ok))).slice(0,3)])}
function mkQ(t,w){
if(t==="y2p")return {t,w,big:w.y,txt:"Qui a remporté le Ballon d'Or cette année-là ?",ok:w.n,o:opts(w.n,W.filter(x=>Math.abs(x.y-w.y)<=12).map(x=>x.n))};
if(t==="club")return {t,w,big:w.y,txt:`Avec quel club ${w.n} est-il sacré ?`,ok:w.cl,o:opts(w.cl,W.map(x=>x.cl))};
if(t==="nat")return {t,w,big:w.y,txt:"De quelle nationalité est le lauréat ?",ok:w.c,o:opts(w.c,W.map(x=>x.c))};
if(t==="input")return {t,w,big:w.y,txt:"Écris le nom du lauréat.",ok:w.n};
if(t==="p2y"){
const ys=W.filter(x=>x.k===w.k).map(x=>x.y),c=[];
for(let d=-7;d<=7;d++){const y=w.y+d;if(y>=1956&&y<=2025&&y!==2020&&!ys.includes(y))c.push(y)}
return {t,w,txt:`En quelle année ${w.n} (${w.cl}) remporte-t-il le Ballon d'Or${ys.length>1?`, pour l'un de ses ${ys.length} titres`:""} ?`,ok:w.y,o:opts(w.y,c).sort((a,b)=>a-b)};
}
const p=pool(),s=[w];
for(const x of [...sh(p.length>=8?p:W),...sh(W)]){if(s.length===4)break;if(!s.some(z=>z.k===x.k))s.push(x)}
return {t,w,txt:"Touche les lauréats du plus ancien au plus récent.",items:sh(s),pk:[]};
}
function startQz(sc){
if(typeof sc==="number"){sel=["c:"+sc];weak=false}
const ys=Array.isArray(sc)?sc:0,c=pick(ys,ys?ys.length:nq),types=["y2p","p2y","club","nat","input"];
qz={q:c.map(w=>mkQ(mode==="mix"?types[Math.floor(Math.random()*types.length)]:mode,w)),i:0,sc:0,st:0,best:0,err:[],done:false};
tab="quiz";render();scrollTo(0,0);
}
function res(good){
const x=qz.q[qz.i];x.good=good;
if(x.t!=="order")mark(x.w.y,good);
if(good){qz.sc++;qz.st++;qz.best=Math.max(qz.best,qz.st)}else{qz.st=0;qz.err.push(x)}
save();render();
}
function ans(i){const x=qz.q[qz.i];if(x.a!==undefined)return;x.a=i;res(x.o[i]===x.ok)}
function sub(){const x=qz.q[qz.i];if(x.a!==undefined)return;x.a=$("in").value;res(accept(x.a,x.w))}
function ord(j){
const x=qz.q[qz.i];if(x.a!==undefined||x.pk.includes(j))return;
x.pk.push(j);
if(x.pk.length<4)return render();
x.a=1;const ys=x.pk.map(k=>x.items[k].y);
res(ys.every((y,k)=>!k||y>ys[k-1]));
}
function next(){qz.i++;if(qz.i>=qz.q.length){qz.done=true;S.games++;S.best=Math.max(S.best,Math.round(qz.sc/qz.q.length*100));save()}render();scrollTo(0,0)}
function vQuiz(){
if(!qz)return `<h2>Quiz</h2><p class="lead">Les années que tu maîtrises le moins passent en premier.</p>
<div class="lbl">Type de questions</div><div class="chips">${MODES.map(([v,l])=>`<button class="chip ${mode===v?"on":""}" onclick="mode='${v}';render()">${l}</button>`).join("")}</div>
<div class="lbl">Nombre de questions</div><div class="chips">${[[10,"10"],[20,"20"],[999,"Toute la sélection"]].map(([v,l])=>`<button class="chip ${nq===v?"on":""}" onclick="nq=${v};render()">${l}</button>`).join("")}</div>
${scopeChips()}<button class="btn" ${pool().length?"":"disabled"} onclick="startQz()">Lancer le quiz</button>`;
if(qz.done){
const n=qz.q.length,r=qz.sc/n,ys=uniq(qz.err.filter(x=>x.t!=="order").map(x=>x.w.y));
const msg=r>=.9?"Niveau Ballon d'Or":r>=.7?"Solide":r>=.5?"Ça rentre":"Relis le chapitre et retente";
return `<h2>${qz.sc}/${n}</h2><p class="lead">${msg}. Meilleure série : ${qz.best} bonnes réponses d'affilée.</p>
${ys.length?`<h3 class="sec">À revoir</h3>${ys.sort((a,b)=>a-b).map(y=>row(W.find(w=>w.y===y))).join("")}<button class="btn" onclick="startQz([${ys}])">Rejouer mes erreurs</button>`:""}
<button class="btn ${ys.length?"alt":""}" onclick="startQz()">Nouveau quiz</button><button class="btn alt" onclick="qz=null;render()">Changer les réglages</button>`;
}
const x=qz.q[qz.i],done=x.a!==undefined,w=x.w;
let body="";
if(x.o)body=x.o.map((o,i)=>`<button class="opt ${done?(o===x.ok?"ok":i===x.a?"ko":""):""}" onclick="ans(${i})">${o}</button>`).join("");
if(x.t==="input")body=done?`<div class="opt ${x.good?"ok":"ko"}">${esc(x.a)||"(vide)"}</div>`:`<input id="in" class="txt" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nom du joueur" onkeydown="if(event.key==='Enter')sub()"><button class="btn" onclick="sub()">Valider</button><div class="hint">Le nom de famille suffit. Une faute de frappe est tolérée.</div>`;
if(x.t==="order")body=x.items.map((it,j)=>{const k=x.pk.indexOf(j);return `<button class="opt ${done?(x.good?"ok":"ko"):""}" onclick="ord(${j})"><span class="num">${k>=0?k+1:""}</span>${it.n} <small>(${it.cl})</small>${done?`<span class="yr">${it.y}</span>`:""}</button>`}).join("")+(done?"":`<button class="link" onclick="qz.q[qz.i].pk=[];render()">Recommencer l'ordre</button>`);
let fb="";
if(done&&x.t==="order")fb=`<div class="fb ${x.good?"":"bad"}"><b>${x.good?"Ordre parfait.":"Pas le bon ordre."}</b> ${[...x.items].sort((a,b)=>a.y-b.y).map(it=>it.y+" "+it.n).join(", ")}</div>`;
else if(done)fb=`<div class="fb ${x.good?"":"bad"}"><b>${x.good?"Bien vu.":"Raté."}</b> ${w.y} : ${w.n}, ${w.cl}, ${w.c}.<br>${w.f}</div>`;
return `<div class="qtop"><span>Question ${qz.i+1}/${qz.q.length}</span><span>Score ${qz.sc}${qz.st>=3?`, série de ${qz.st}`:""}</span></div>
<div class="bar"><i style="width:${qz.i/qz.q.length*100}%"></i></div>
${x.big?`<div class="yr qyear">${x.big}</div>`:""}<div class="qtext">${x.txt}</div>${body}${fb}
${done?`<button class="btn" onclick="next()">${qz.i+1<qz.q.length?"Question suivante":"Voir le résultat"}</button>`:""}
<div style="margin-top:18px"><button class="link" onclick="qz=null;render()">Quitter le quiz</button></div>`;
}

function lst(){
const f=norm(q);
if(!f)return rows(1956,2025,true);
const r=W.filter(w=>norm(`${w.y} ${w.n} ${w.cl} ${w.c} ${w.a.join(" ")}`).includes(f));
return r.length?r.map(w=>row(w,true)).join(""):`<p class="lead" style="margin-top:14px">Aucun résultat pour cette recherche. Essaie un nom de famille, un club ou un pays.</p>`;
}
function vListe(){
return `<h2>Palmarès</h2><p class="lead">Masque les noms pour t'auto-tester, puis touche une ligne pour la révéler.</p>
<input class="txt" placeholder="Joueur, club, pays ou année" value="${esc(q)}" oninput="q=this.value;$('lst').innerHTML=lst()">
<div class="chips" style="margin-top:12px"><button class="chip ${hide?"on":""}" onclick="hide=!hide;render()">Masquer les noms</button></div>
<div id="lst">${lst()}</div>`;
}

function counts(k){const m={};W.forEach(w=>m[w[k]]=(m[w[k]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(l){const mx=l[0][1];return l.map(([k,v])=>`<div class="st"><span>${k}</span><b class="yr" style="font-size:22px">${v}</b><div class="b"><i style="width:${v/mx*100}%"></i></div></div>`).join("")}
function reset(){if(!rz){rz=true;return render()}S={box:{},games:0,best:0};rz=false;save();render()}
function vStats(){
const m=W.filter(w=>bx(w.y)>=3).length,seen=W.filter(w=>bx(w.y)>0).length;
const ch=CH.map((c,i)=>[`${c.a} à ${c.b}`,chW(i).filter(w=>bx(w.y)>=3).length,chW(i).length]);
return `<h2>Stats</h2><p class="lead">Ta progression, et les records à connaître par cœur.</p>
<div class="me"><div><span class="yr">${m}</span><span class="lbl">années maîtrisées</span></div><div><span class="yr">${seen}</span><span class="lbl">années déjà vues</span></div><div><span class="yr">${S.games}</span><span class="lbl">quiz terminés</span></div><div><span class="yr">${S.best}%</span><span class="lbl">meilleur score</span></div></div>
<h3 class="sec">Par chapitre</h3>${ch.map(([l,a,b])=>`<div class="st"><span>${l}</span><b class="yr" style="font-size:22px">${a}/${b}</b><div class="b"><i style="width:${a/b*100}%"></i></div></div>`).join("")}
<h3 class="sec">Joueurs sacrés plusieurs fois</h3>${bars(counts("n").filter(e=>e[1]>1))}
<h3 class="sec">Titres par nationalité</h3>${bars(counts("c"))}
<h3 class="sec">Titres par club</h3>${bars(counts("cl"))}
<button class="btn alt" style="margin-top:28px;${rz?"border-color:var(--miss);color:var(--miss)":""}" onclick="reset()">${rz?"Confirmer : tout effacer":"Remettre ma progression à zéro"}</button>`;
}

load();
</script>
</body>
</html>
